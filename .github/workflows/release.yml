name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Test the backend
        working-directory: backend
        run: |
          pip install -r requirements-dev.txt
          python -m pytest

      - name: Build the console
        working-directory: console
        run: |
          npm ci
          npm run build
          tar -czf "$GITHUB_WORKSPACE/jarvismind-console-${GITHUB_REF_NAME}.tar.gz" -C dist .

      - name: Build the Python SDK
        working-directory: sdk/python
        run: |
          python -m pip install build
          python -m build --outdir "$GITHUB_WORKSPACE/dist-python"

      - name: Build the TypeScript SDK
        working-directory: sdk/typescript
        run: |
          npm ci
          npm test
          npm pack --pack-destination "$GITHUB_WORKSPACE"

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            jarvismind-console-*.tar.gz
            dist-python/*
            *.tgz
