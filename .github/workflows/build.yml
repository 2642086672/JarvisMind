name: build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          load: true
          tags: jarvismind:ci
      - name: Smoke test the health endpoint
        run: |
          docker run -d --name jarvismind-ci -p 127.0.0.1:8777:8777 jarvismind:ci
          for attempt in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8777/health; then
              echo
              docker rm -f jarvismind-ci
              exit 0
            fi
            sleep 2
          done
          docker logs jarvismind-ci || true
          docker rm -f jarvismind-ci || true
          exit 1
