# JarvisMind 1.0.0 single-node deployment.
#
# Not verified in the release environment: build and run it once, and check the
# health status, before you rely on it. See docs/DOCKER.md.
name: jarvismind

services:
  jarvismind:
    build:
      context: .
      dockerfile: Dockerfile
    image: jarvismind:1.0.0
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    ports:
      # Published on the loopback interface only. Put a TLS proxy in front to expose it.
      - "127.0.0.1:8777:8777"
    volumes:
      - jarvismind-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8777/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  jarvismind-data:
